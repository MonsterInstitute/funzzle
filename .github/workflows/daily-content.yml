name: Daily Content

on:
  schedule:
    # 07:15 UTC every day. Wordle & Connections publish just after midnight ET;
    # the Mini answer sources are updated well before this.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      backfill_last:
        description: "Backfill the last N days for all games (blank = normal single-day run)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # keepalive step below re-enables this workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Normal daily run. generate-daily-content.mjs fetches Wordle, Connections
      # and the NYT Mini from PUBLIC sources and EXITS NON-ZERO if any of the
      # three fails — so a broken source turns this job RED instead of passing as
      # a silent partial success.
      - name: Generate today's content
        if: ${{ github.event.inputs.backfill_last == '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Refreshes today's pages on demand (app/api/revalidate). The deploy
          # hook is only a fallback if that request fails.
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://www.funzzle.com
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: node scripts/generate-daily-content.mjs

      # Manual backfill (workflow_dispatch with backfill_last=N). Non-destructive:
      # a game that can't be fetched for a day leaves any existing row untouched.
      - name: Backfill last N days
        if: ${{ github.event.inputs.backfill_last != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://www.funzzle.com
        run: |
          node scripts/backfill-answers.mjs --last=${{ github.event.inputs.backfill_last }}
          # Refresh the backfilled answer pages on demand; redeploy only if that fails.
          if ! node scripts/revalidate-site.mjs --last=${{ github.event.inputs.backfill_last }}; then
            if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
              echo "Revalidation failed — triggering redeploy after backfill…"
              curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" && echo " ok"
            fi
          fi

      - name: Generate Reddit posts (logged for manual posting)
        if: ${{ always() && github.event.inputs.backfill_last == '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node scripts/reddit-post.mjs

      - name: Generate tweet (logged for manual posting)
        if: ${{ always() && github.event.inputs.backfill_last == '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node scripts/twitter-post.mjs

      # GitHub disables scheduled workflows in a public repo after 60 days with
      # no repository activity — that silently stopped this job on 2026-09-21.
      # Re-enabling it through the API after every scheduled run keeps the
      # schedule alive without making a commit (a commit would mean a deploy).
      - name: Keep the schedule alive
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-content.yml/enable"
