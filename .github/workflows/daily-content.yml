name: Daily Content

on:
  # This job adds DeepSeek explanations to today's and tomorrow's answers. It is
  # NOT what gets answers live on time: GitHub starts scheduled runs hours late,
  # so the site's answers cron (app/api/cron/answers, a Cloudflare Cron Trigger,
  # on the minute) stores the bare answers before each UTC day begins, and this job
  # replaces those rows with explained copies whenever it runs. Two runs a day
  # so a late or skipped run still leaves time to explain tomorrow's answers.
  schedule:
    - cron: "15 7 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
    inputs:
      backfill_last:
        description: "Backfill the last N days (blank = normal run)"
        required: false
        default: ""
      backfill_games:
        description: "Games to backfill (comma-separated)"
        required: false
        default: "wordle,connections,nyt-mini"
      backfill_missing_only:
        description: "Only fill missing rows (leave existing rows untouched)"
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # keepalive step below re-enables this workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Normal daily run. generate-daily-content.mjs fetches Wordle, Connections
      # and the NYT Mini from PUBLIC sources and EXITS NON-ZERO if any of the
      # three fails — so a broken source turns this job RED instead of passing as
      # a silent partial success.
      - name: Generate today's content
        if: ${{ github.event.inputs.backfill_last == '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Refreshes today's pages on demand (app/api/revalidate on the Worker).
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://www.funzzle.com
        run: node scripts/generate-daily-content.mjs

      # Manual backfill (workflow_dispatch with backfill_last=N). Non-destructive:
      # a game that can't be fetched for a day leaves any existing row untouched.
      # Any failed (date, game) turns the run red, after refreshing what was written.
      - name: Backfill last N days
        if: ${{ github.event.inputs.backfill_last != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: https://www.funzzle.com
          BACKFILL_LAST: ${{ github.event.inputs.backfill_last }}
          BACKFILL_GAMES: ${{ github.event.inputs.backfill_games }}
          BACKFILL_MISSING_ONLY: ${{ github.event.inputs.backfill_missing_only }}
        run: |
          status=0
          node scripts/backfill-answers.mjs --last="$BACKFILL_LAST" --games="$BACKFILL_GAMES" \
            $([ "$BACKFILL_MISSING_ONLY" = "true" ] && echo --missing-only) || status=$?
          # Refresh the backfilled answer pages on demand; a failure turns the run red.
          node scripts/revalidate-site.mjs --last="$BACKFILL_LAST" || status=1
          exit $status

      - name: Generate Reddit posts (logged for manual posting)
        if: ${{ always() && github.event.inputs.backfill_last == '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node scripts/reddit-post.mjs

      - name: Generate tweet (logged for manual posting)
        if: ${{ always() && github.event.inputs.backfill_last == '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node scripts/twitter-post.mjs

      # GitHub disables scheduled workflows in a public repo after 60 days with
      # no repository activity — that silently stopped this job on 2026-09-21.
      # Re-enabling it through the API after every scheduled run keeps the
      # schedule alive without making a commit (a commit would mean a deploy).
      - name: Keep the schedule alive
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-content.yml/enable"
