name: Deploy to Cloudflare

# Builds with OpenNext and deploys the Worker (wrangler.jsonc) on every push to
# main that touches the app — the Cloudflare equivalent of Vercel's Git
# integration. Docs-only and test-only changes don't deploy.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, Workers
# Routes, Workers R2, D1: Edit) and CLOUDFLARE_ACCOUNT_ID. Until they exist the
# job skips with a notice instead of failing every push.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tests/**"
      - "e2e/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - ".github/workflows/daily-content.yml"
      - ".claude/**"
      - ".vscode/**"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the Cloudflare deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      # The build prerenders pages from Supabase, as Vercel builds did; the
      # service role is used only by the build here (scripts/strip-bundled-env.mjs
      # keeps it out of the Worker bundle — the Worker reads its own secret).
      - name: Build and deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: npm run cf:deploy
