name: Deploy to Cloudflare

# Builds with OpenNext and deploys the Worker (wrangler.jsonc) on every push to
# main that touches the app — the Cloudflare equivalent of Vercel's Git
# integration. Docs-only and test-only changes don't deploy.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts, Workers
# Routes, Workers R2, D1: Edit) and CLOUDFLARE_ACCOUNT_ID. Until they exist the
# job skips with a notice instead of failing every push.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tests/**"
      - "e2e/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - ".github/workflows/gsc-report.yml"
      - "scripts/gsc-report.mjs"
      - "scripts/lib/cloudflare-report.mjs"
      - "reports/**"
      - "design/**"
      - ".github/workflows/test.yml"
      - ".claude/**"
      - ".vscode/**"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping the Cloudflare deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      # Schema first (migrations/, tracked in d1_migrations): a deploy whose
      # code needs a new column never runs against the old schema. Applied
      # migrations are skipped, so this is a no-op on most deploys.
      - name: Apply D1 migrations
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply funzzle-db --remote

      # The build prerenders pages from D1 through the binding's remote proxy
      # (wrangler.jsonc "remote": true), authenticated by the same token.
      - name: Build and deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
