name: Tests

# Unit tests (game rules, solvers, generators, Game Kit) and a typecheck on
# every push and pull request. The Playwright E2E suite (e2e/) runs against a
# server: `npm run test:e2e` locally or with BASE_URL set.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
