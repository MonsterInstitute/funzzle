<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Sudoku</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#3A22C9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #111111; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

<div style="background: #EAF0FF; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">Daily Sudoku</span>
<span style="font-size: 12px; color: #44445A">Fri, Oct 23 · Hard</span>
</div>
<span style="min-width: 44px; height: 44px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">06:12</span>
</div>
<div style="display: flex; gap: 8px; justify-content: center">
<span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600">Rating 1,482</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600">Mistakes 0 / 3</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 600">Notes on</span>
</div>
</div>

<div style="padding: 0 16px">
<div role="grid" aria-label="Sudoku grid" style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); border: 2px solid #111111; border-radius: 14px; overflow: hidden">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="81">
<div role="gridcell" style="{{c.style}}">
<sc-if value="{{c.hasNotes}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; height: 100%; padding: 2px; box-sizing: border-box">
<sc-for list="{{c.notes}}" as="n" hint-placeholder-count="9">
<span style="font-family: 'Geist Mono', monospace; font-size: 9px; line-height: 1; display: flex; align-items: center; justify-content: center; color: #4A4A5E">{{n}}</span>
</sc-for>
</div>
</sc-if>
<sc-if value="{{c.hasValue}}" hint-placeholder-val="{{ true }}">
<span style="{{c.textStyle}}">{{c.v}}</span>
</sc-if>
</div>
</sc-for>
</div>
</div>

<section aria-label="Coach" style="margin: 0 16px; padding: 14px 16px; border-radius: 18px; background: #FFF4EC; border: 1px solid #FFD6B8; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">
<span style="width: 26px; height: 26px; border-radius: 999px; background: #F26B1D; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9.5l-4.2 1.9L12 16l-1.8-4.6L6 9.5l4.2-1.9z"></path></svg>
</span>
Coach · Hint 2 of 3
</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #8A3605">Naked single</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #2A2A33">Look at the outlined cell. Its row is missing 3, 6 and 7. Its box is missing 1, 5 and 7. Only one number fits both.</p>
<div style="display: flex; gap: 8px">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Show the answer</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E8BFA2; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Teach me this</button>
</div>
</section>

<div style="padding: 0 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
<button type="button" style="min-height: 52px; border-radius: 14px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
{{t.label}}
</button>
</sc-for>
</div>

<div style="padding: 0 16px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px">
<sc-for list="{{pad}}" as="p" hint-placeholder-count="9">
<button type="button" aria-label="Enter {{p.n}}" style="min-height: 60px; border-radius: 14px; border: 0; background: #EEF2FF; color: #111111; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0">
{{p.n}}
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 500; color: #44445A">{{p.left}}</span>
</button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = ['53..7....','6..195...','.98....6.','8...6...3','4..8.3..1','7...2...6','.6....28.','...419..5','....8..79'];
    var U = { '0,2': '4', '0,3': '6', '1,1': '7', '1,2': '2', '2,0': '1', '3,1': '5', '4,1': '2', '6,0': '9', '7,0': '2', '7,1': '8', '8,0': '3', '8,1': '4' };
    var N = { '6,2': ['1','5'], '8,2': ['1','5'], '5,1': ['1'] };
    var sel = [7, 2];
    var cells = [];
    var counts = {};
    for (var r = 0; r < 9; r++) {
      for (var c = 0; c < 9; c++) {
        var key = r + ',' + c;
        var given = P[r][c] !== '.' ? P[r][c] : '';
        var user = U[key] || '';
        var v = given || user;
        if (v) counts[v] = (counts[v] || 0) + 1;
        var isSel = r === sel[0] && c === sel[1];
        var peer = !isSel && (r === sel[0] || c === sel[1] || (Math.floor(r / 3) === Math.floor(sel[0] / 3) && Math.floor(c / 3) === Math.floor(sel[1] / 3)));
        var bg = isSel ? '#FFE6D3' : peer ? '#EEF2FF' : '#FFFFFF';
        var br = c === 8 ? '0' : (c % 3 === 2 ? '2px solid #111111' : '1px solid #D3D8EA');
        var bb = r === 8 ? '0' : (r % 3 === 2 ? '2px solid #111111' : '1px solid #D3D8EA');
        var ring = isSel ? 'box-shadow: inset 0 0 0 3px #F26B1D; ' : '';
        var notes = null;
        if (N[key]) {
          notes = ['1','2','3','4','5','6','7','8','9'].map(function (d) { return N[key].indexOf(d) >= 0 ? d : ''; });
        }
        cells.push({
          v: v,
          hasValue: !!v,
          hasNotes: !!notes,
          notes: notes || [],
          style: 'aspect-ratio: 1; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: ' + bg + '; border-right: ' + br + '; border-bottom: ' + bb + '; ' + ring,
          textStyle: given
            ? 'font-family: Geist, sans-serif; font-size: 22px; font-weight: 650; color: #111111'
            : 'font-family: Geist, sans-serif; font-size: 22px; font-weight: 500; color: #3A22C9'
        });
      }
    }
    var pad = [];
    for (var d = 1; d <= 9; d++) {
      var left = 9 - (counts[String(d)] || 0);
      pad.push({ n: String(d), left: left + ' left' });
    }
    var tools = [
      { label: 'Undo', icon: 'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3', bg: '#F3F3F7', fg: '#111111' },
      { label: 'Erase', icon: 'M20 20H9L4 15l9-9 7 7-6 7M7.5 11.5l7 7', bg: '#F3F3F7', fg: '#111111' },
      { label: 'Notes', icon: 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4', bg: '#111111', fg: '#FFFFFF' },
      { label: 'Hint · 1 left', icon: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z', bg: '#FFE6D3', fg: '#111111' }
    ];
    return { cells: cells, pad: pad, tools: tools };
  }
}
</script>
</body>
</html>
