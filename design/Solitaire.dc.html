<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Solitaire</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#3A22C9}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E9F7EE; color: #111111; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

<div style="padding: 10px 12px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">Daily Solitaire</span>
<span style="font-size: 12px; color: #2F4A3A">Klondike · Draw 1</span>
</div>
<span style="min-width: 44px; height: 44px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">03:41</span>
</div>
<div style="display: flex; gap: 8px; justify-content: center">
<span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600">Moves 42</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #FFFFFF; font-size: 13px; font-weight: 600">Score 610</span>
<span style="padding: 6px 12px; border-radius: 999px; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
Winnable deal</span>
</div>
</div>

<div style="padding: 0 16px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<div style="height: 64px; border-radius: 8px; background: #5B3DF5; border: 2px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600">18</div>
<div style="height: 64px; border-radius: 8px; background: #FFFFFF; border: 1px solid #C9DACF; box-sizing: border-box; padding: 4px 5px; display: flex; flex-direction: column; color: #C8102E">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; line-height: 1">5</span>
<span style="font-size: 12px; line-height: 1">♥</span>
<span style="margin-top: auto; align-self: center; font-size: 22px; line-height: 1">♥</span>
</div>
<div></div>
<sc-for list="{{foundations}}" as="f" hint-placeholder-count="4">
<div style="{{f.style}}">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; line-height: 1">{{f.rank}}</span>
<span style="margin-top: auto; align-self: center; font-size: 22px; line-height: 1">{{f.suit}}</span>
</div>
</sc-for>
</div>

<div style="padding: 0 16px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="7">
<div style="position: relative; height: 184px">
<sc-for list="{{col.cards}}" as="k" hint-placeholder-count="3">
<div style="{{k.style}}">
<sc-if value="{{k.up}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 15px; line-height: 1">{{k.rank}}</span>
<span style="font-size: 12px; line-height: 1">{{k.suit}}</span>
<span style="margin-top: auto; align-self: center; font-size: 22px; line-height: 1">{{k.suit}}</span>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #2F4A3A"><span>Cards home</span><span style="font-family: 'Geist Mono', monospace">3 / 52</span></div>
<div aria-hidden="true" style="height: 8px; border-radius: 4px; background: #CFE8D8; overflow: hidden"><div style="width: 6%; height: 8px; border-radius: 4px; background: #1F7A4D"></div></div>
</div>

<section aria-label="Coach" style="margin: auto 16px 0; padding: 14px 16px; border-radius: 18px; background: #FFF4EC; border: 1px solid #FFD6B8; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">
<span style="width: 26px; height: 26px; border-radius: 999px; background: #F26B1D; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9.5l-4.2 1.9L12 16l-1.8-4.6L6 9.5l4.2-1.9z"></path></svg>
</span>
Coach · Best move
</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #8A3605">1 of 3 moves</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #2A2A33">Move the 7♣ onto the 8♥. It turns over a hidden card in column 4, which opens up the most new moves.</p>
<div style="display: flex; gap: 8px">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Make this move</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E8BFA2; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Why this one?</button>
</div>
</section>

<div style="padding: 0 16px 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
<button type="button" style="min-height: 56px; border-radius: 14px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font-family: inherit; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
{{t.label}}
</button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var RED = '#C8102E';
    var BLK = '#111111';
    var faceUp = function (top, color, extra) {
      return 'position: absolute; left: 0; right: 0; top: ' + top + 'px; height: 64px; border-radius: 8px; background: #FFFFFF; border: 1px solid #C9DACF; box-sizing: border-box; padding: 4px 5px; display: flex; flex-direction: column; color: ' + color + '; ' + (extra || '');
    };
    var faceDown = function (top) {
      return 'position: absolute; left: 0; right: 0; top: ' + top + 'px; height: 64px; border-radius: 8px; background: #5B3DF5; border: 2px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 0 0 1px #3A22C9';
    };
    var spec = [
      [[], [['K','♠',BLK]]],
      [[1], [['Q','♥',RED]]],
      [[1,1], [['8','♥',RED,'target']]],
      [[1,1,1], [['7','♣',BLK,'source']]],
      [[1,1,1,1], [['J','♦',RED],['10','♠',BLK]]],
      [[1,1,1,1,1], [['4','♦',RED]]],
      [[1,1,1,1,1,1], [['9','♣',BLK]]]
    ];
    var columns = spec.map(function (s) {
      var cards = [];
      var top = 0;
      s[0].forEach(function () { cards.push({ up: false, style: faceDown(top) }); top += 14; });
      s[1].forEach(function (u) {
        var extra = u[3] === 'source' ? 'box-shadow: 0 0 0 3px #F26B1D;' : u[3] === 'target' ? 'outline: 2px dashed #F26B1D; outline-offset: 2px;' : '';
        cards.push({ up: true, rank: u[0], suit: u[1], style: faceUp(top, u[2], extra) });
        top += 26;
      });
      return { cards: cards };
    });
    var slot = 'height: 64px; border-radius: 8px; box-sizing: border-box; padding: 4px 5px; display: flex; flex-direction: column; ';
    var foundations = [
      { rank: 'A', suit: '♥', style: slot + 'background: #FFFFFF; border: 1px solid #C9DACF; color: ' + RED },
      { rank: '2', suit: '♠', style: slot + 'background: #FFFFFF; border: 1px solid #C9DACF; color: ' + BLK },
      { rank: '', suit: '♦', style: slot + 'border: 2px dashed #9CC3AA; color: #6E9A80' },
      { rank: '', suit: '♣', style: slot + 'border: 2px dashed #9CC3AA; color: #6E9A80' }
    ];
    var tools = [
      { label: 'Undo', icon: 'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3', bg: '#FFFFFF', fg: '#111111' },
      { label: 'Hint', icon: 'M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z', bg: '#FFE6D3', fg: '#111111' },
      { label: 'Auto-finish', icon: 'M5 12h14M13 6l6 6-6 6', bg: '#FFFFFF', fg: '#111111' },
      { label: 'Options', icon: 'M4 7h16M4 12h16M4 17h16', bg: '#FFFFFF', fg: '#111111' }
    ];
    return { columns: columns, foundations: foundations, tools: tools };
  }
}
</script>
</body>
</html>
